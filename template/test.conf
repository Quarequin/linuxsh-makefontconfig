<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- -->
<fontconfig>
  <!-- Generic name aliasing -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Go Noto Current-Regular</family>
    </prefer>
  </alias>
  <alias>
    <family>-apple-system</family>
    <prefer>
      <family>Go Noto Current-Regular</family>
    </prefer>
  </alias>
  <alias>
    <family>Segoe UI Webfont</family>
    <prefer>
      <family>Go Noto Current-Regular</family>
    </prefer>
  </alias>
  <alias>
    <family>Segoe UI</family>
    <prefer>
      <family>Go Noto Current-Regular</family>
    </prefer>
  </alias>
  <alias>
    <family>arial</family>
    <prefer>
      <family>Go Noto Current-Regular</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Go Noto Current Serif</family>
    </prefer>
  </alias>
  <alias>
    <family>times</family>
    <prefer>
      <family>Go Noto Current Serif</family>
    </prefer>
  </alias>
  <alias>
    <family>times new roman</family>
    <prefer>
      <family>Go Noto Current Serif</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Monaco</family>
      <family>Noto Mono</family>
      <family>Go Noto Current-Regular</family>
    </prefer>
  </alias>
</fontconfig>
